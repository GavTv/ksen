<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <title>Particles Morph</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="container"></div>

    <div class="input-container">
      <div class="input-wrapper">
        <input
          type="text"
          id="morphText"
          maxlength="70"
          autocomplete="off"
          placeholder="Enter your text"
        />
        <button type="button" id="typeBtn">Create</button>
      </div>
      <div class="input-meta">
        <span id="historyCount" class="history-count"></span>
        <button type="button" id="clearHistoryBtn" class="clear-history-btn">Новый чат</button>
        <div class="char-counter"><span id="charCount">0</span>/70</div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
